# Netlify detecta Next.js y usa su adaptador oficial automáticamente.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # La URL de Supabase y la clave publicable son públicas por diseño (van al navegador para el login).
  # Las claves secretas (SUPABASE_SECRET_KEY, FOS_CRON_SECRET) siguen vigiladas por el escáner.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

[functions]
  directory = "netlify/functions"
